<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六歲的哥哥，兩歲的妹妹</title>
<meta name="description" content="鬧起來的時候翻這一頁：誰 → 什麼狀況 → 劇本，下面點開解析。2027 年 6 月版。">
<style>
  :root{
    /* 日和配色：晴天、雲、草地、桃子、檸檬、薰衣草；全部淺色，文字用暖褐不用黑 */
    --bg:#FDFBF4; --sky:#DFF3FD; --ink:#4B4238; --ink2:#7D7266; --line:#EFE9DC; --card:#FFFFFF;
    --ge:#8FD0F5;  --ge-d:#3C9BD9;  --ge-l:#E6F5FE;   /* 哥哥 晴空藍 */
    --mei:#FFB29A; --mei-d:#E8714F; --mei-l:#FFEDE5;  /* 妹妹 桃子橘 */
    --ev:#FFE07A;  --ev-d:#C9960A;  --ev-l:#FFF7D6;   /* 狀況 檸檬黃 */
    --sc:#A8E6B8;  --sc-d:#2E8C5A;  --sc-l:#E8F8EC;   /* 劇本 草地綠 */
    --an:#CDBBF5;  --an-d:#7458C9;  --an-l:#F2EDFD;   /* 解析 薰衣草 */
    --no:#FFB7CF;  --no-d:#C94A74;  --no-l:#FFE9F1;   /* 別說 櫻花粉 */
    --r:18px;
    --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
    --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",Georgia,serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:linear-gradient(180deg,var(--sky) 0,var(--bg) 220px);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6}
  main{max-width:720px;margin:0 auto;padding:0 16px 80px}
  h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:800}
  h1{font-size:2.1rem;letter-spacing:-.01em}
  p{margin:.4em 0}
  ul{margin:.3em 0;padding-left:1.15em}
  li{margin:.25em 0}
  button{font:inherit;color:var(--ink);cursor:pointer}
  button:focus-visible,summary:focus-visible{outline:3px solid var(--an);outline-offset:3px}
  .lede{color:var(--ink2);font-size:1rem;max-width:34em}
  .say{font-family:var(--serif);color:var(--sc-d);font-size:1.25rem;line-height:1.6;font-weight:600}
  .say::before{content:"「"} .say::after{content:"」"}
  .muted{color:var(--ink2);font-size:.9rem}

  header{padding:30px 0 6px}

  /* 三層大區塊共用 */
  .step{margin:26px 0 0;border-radius:var(--r);padding:18px 16px 20px;background:var(--card);box-shadow:0 6px 18px rgba(120,100,60,.08)}
  .step .lab{display:inline-block;font-size:.85rem;font-weight:800;padding:3px 12px;border-radius:999px;color:var(--ink);margin-bottom:8px;background:#fff}
  .step h2{font-size:1.7rem;margin-bottom:12px}
  .step.s1{background:linear-gradient(120deg,var(--ge-l) 0%,#fff 50%,var(--mei-l) 100%)}
  .step.s2{background:var(--ev-l)}
  .step.s2 .lab{background:var(--ev)}
  .step.s3{background:var(--sc-l)}
  .step.s3 .lab{background:var(--sc)}

  /* 1 誰 */
  .kids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kid{border:3px solid transparent;border-radius:var(--r);padding:16px;text-align:left;background:var(--card);box-shadow:0 3px 0 rgba(120,100,60,.08)}
  .kid .n{font-size:3rem;font-weight:900;line-height:1;letter-spacing:-.03em}
  .kid .n small{font-size:1rem;font-weight:700;margin-left:4px}
  .kid .who{font-size:1.4rem;font-weight:800;margin-top:6px}
  .kid .when{color:var(--ink2);font-size:.9rem}
  .kid[data-kid="ge"]{color:var(--ge-d);border-color:var(--ge-l)}
  .kid[data-kid="mei"]{color:var(--mei-d);border-color:var(--mei-l)}
  .kid[data-kid="ge"][aria-pressed="true"]{background:var(--ge);border-color:var(--ge-d);color:var(--ink)}
  .kid[data-kid="mei"][aria-pressed="true"]{background:var(--mei);border-color:var(--mei-d);color:var(--ink)}
  .kid[aria-pressed="true"] .when{color:var(--ink2)}

  /* 2 什麼狀況：他現在的樣子 + 事件磚 */
  .dev{background:var(--card);border-radius:14px;padding:12px 14px 6px;margin:0 0 14px}
  .dev > summary{list-style:none;cursor:pointer;font-weight:800;font-size:1.1rem;display:flex;align-items:center;padding:2px 0 8px}
  .dev > summary::-webkit-details-marker{display:none}
  .dev > summary::after{content:"收起";margin-left:auto;font-size:.85rem;font-weight:600;color:var(--ink2)}
  .dev:not([open]) > summary::after{content:"展開"}
  .dev:not([open]) > summary{padding-bottom:4px}
  .devg{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
  .devg h4{font-size:.9rem;color:var(--ink2);margin:6px 0 2px;font-weight:800}
  .devg ul{margin:0 0 8px;padding-left:1.1em;font-size:.93rem;line-height:1.55}
  .devg li{margin:.2em 0}
  .cat{margin:16px 0 6px;font-size:.95rem;font-weight:800;color:var(--ev-d)}
  .evs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ev{border:0;border-radius:14px;background:var(--card);padding:14px 14px 12px;text-align:left;box-shadow:0 3px 0 rgba(120,100,60,.08)}
  .ev .t{font-size:1.2rem;font-weight:800;line-height:1.25}
  .ev .s{color:var(--ink2);font-size:.9rem;margin-top:4px}
  .ev[aria-pressed="true"]{background:var(--ev);color:var(--ink);box-shadow:none}
  .ev[aria-pressed="true"] .s{color:var(--ink2)}
  .picked{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .picked .ev{flex:1 1 240px}
  .swap{border:2px solid var(--ev-d);color:var(--ev-d);border-radius:999px;background:#fff;padding:8px 16px;font-weight:800}

  /* 3 劇本 */
  .scene{font-size:1.05rem;color:var(--ink2);margin-bottom:12px}
  .first{background:var(--card);border-radius:14px;padding:12px 14px;font-weight:600;font-size:1.05rem}
  .first b{color:var(--sc-d);margin-right:6px}
  .lines{list-style:none;margin:10px 0 0;padding:0}
  .lines li{background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0}
  .next{margin-top:18px}
  .next h3{font-size:1.1rem;margin-bottom:8px}
  .br{display:grid;grid-template-columns:7em 1fr;gap:10px;background:var(--card);border-radius:14px;padding:10px 14px;margin:8px 0;align-items:start}
  .br .k{font-weight:800;font-size:1.05rem;padding-top:3px}
  .br .say{font-size:1.1rem}
  .br .muted{display:block;margin-top:2px}
  .noline{background:var(--no-l);border-radius:14px;padding:10px 14px;margin:14px 0 0;font-size:.98rem}
  .noline b{color:var(--no-d)}

  /* 解析 */
  .an{margin:18px 0 0;border-radius:var(--r);background:var(--an-l);border:0}
  .an summary{list-style:none;cursor:pointer;padding:16px 18px;font-size:1.35rem;font-weight:800;color:var(--an-d);display:flex;align-items:center}
  .an summary::-webkit-details-marker{display:none}
  .an summary::after{content:"＋";margin-left:auto;font-weight:400}
  .an[open] summary::after{content:"－"}
  .an .body{padding:0 16px 16px}
  .an h3{font-size:1.15rem;margin:16px 0 6px;color:var(--an-d)}
  .an ul{margin-bottom:0}
  .an .box{background:var(--card);border-radius:14px;padding:10px 14px}
  .needs li b,.normal li b{color:var(--ink2);font-weight:700;margin-right:6px}
  .cores{list-style:none;padding:0;margin:0}
  .cores li{padding:10px 0;border-bottom:1px dashed var(--line)}
  .cores li:last-child{border-bottom:0}
  .cores .nm{font-weight:800;display:block;margin-bottom:2px}
  .cores .nm small{color:var(--ink2);font-weight:600;margin-left:6px}
  .grp{font-size:.9rem;font-weight:800;color:var(--an-d);margin:12px 0 4px}

  .tools{margin:14px 0 0;display:flex;gap:8px;flex-wrap:wrap}
  .tools button{border:2px solid var(--ev);border-radius:999px;background:#fff;padding:6px 14px;font-size:.9rem;font-weight:700}
  .allview .step.s3{margin-top:30px}
  footer{margin-top:50px;padding-top:12px;border-top:1px solid var(--line);color:var(--ink2);font-size:.88rem}

  @media (max-width:520px){ .devg{grid-template-columns:1fr} }
  @media (max-width:430px){ .kid .n{font-size:2.5rem} .evs{grid-template-columns:1fr} .br{grid-template-columns:5.5em 1fr} }
  @media print{
    body{background:#fff;color:#000;font-size:11.5pt}
    .tools,.swap,.kid:not([aria-pressed="true"]){display:none}
    .step,.br,.an{break-inside:avoid;box-shadow:none}
    .an summary::after,.dev > summary::after{display:none}
  }
  @media (prefers-reduced-motion:no-preference){
    .an .body{animation:open .18s ease-out}
    @keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<main>

<header>
  <h1>六歲的哥哥，兩歲的妹妹</h1>
  <p class="lede">鬧起來的時候翻這一頁。選誰、選狀況、照劇本說；想知道為什麼，再點開解析。年齡固定在 2027 年 6 月。</p>
</header>

<section class="step s1" id="s1">

<div id="app" aria-live="polite"></div>

</footer>

</main>

/* ───────────── 畫面 ───────────── */
const app = document.getElementById('app');
let state = { kid:null, ev:null, all:false };

function readHash(){
  const h = location.hash.replace(/^#/,'').split('/');
  state.kid = KIDS[h[0]] ? h[0] : null;
  state.all = h[1] === 'all';
  state.ev  = (!state.all && h[1] && EVENTS.some(e=>e.id===h[1] && e.kid===state.kid)) ? h[1] : null;
}
function setHash(h){ if(location.hash===h) render(); else location.hash = h; }
function say(t){ return t ? '<span class="say">'+t+'</span>' : ''; }
const catName = id => CATS.find(c=>c.id===id).name;

function evTile(e, pressed){
  return '<button type="button" class="ev" data-ev="'+e.id+'" aria-pressed="'+pressed+'"><div class="t">'+e.title+'</div><div class="s">'+e.scene+'</div></button>';
}

function renderList(mine){
  let s = '';
  CATS.forEach(c=>{
    const evs = mine.filter(e=>e.cat===c.id);
    if(!evs.length) return;
    s += '<div class="cat">'+c.name+'</div><div class="evs">'+evs.map(e=>evTile(e,false)).join('')+'</div>';
  });
  return s;
}

function renderScript(e, standalone){
  const k = KIDS[e.kid];
  let s = '<section class="step s3"><span class="lab">3</span><h2>劇本</h2>';
  if(standalone) s += '<p style="font-weight:800;font-size:1.2rem;margin:0 0 2px">'+e.title+'</p>';
  s += '<p class="scene">'+e.scene+'</p>';
  s += '<div class="first"><b>先做</b>'+e.first+'</div>';
  s += '<ul class="lines">'+e.say.map(t=>'<li>'+say(t)+'</li>').join('')+'</ul>';
  s += '<div class="next"><h3>接下來'+k.pron+'可能……</h3>'
     + e.next.map(n=>'<div class="br"><div class="k">'+n[0]+'</div><div>'+say(n[1])+(n[2]?'<span class="muted">'+n[2]+'</span>':'')+'</div></div>').join('')
     + '</div>';
  s += '<div class="noline"><b>別說</b> '+e.avoid+'</div>';

  s += '<details class="an"><summary>解析</summary><div class="body">';
  s += '<h3>這件事正常嗎</h3><div class="box"><ul class="normal">'+e.normal.filter(n=>n[1]!=='—').map(n=>'<li><b>'+n[0]+'</b>'+n[1]+'</li>').join('')+'</ul></div>';
  s += '<h3>'+k.pron+'可能在要什麼</h3><div class="box"><ul class="needs">'+e.needs.map(n=>'<li><b>'+n[0]+'</b>'+n[1]+'</li>').join('')+'</ul></div>';
  s += '<h3>各學派怎麼看</h3><div class="box">';
  s += '<div class="grp">先看什麼</div><ul class="cores">'+LOOK.filter(c=>e.cores[c]).map(c=>'<li><span class="nm">'+CORES[c][0]+'<small>'+CORES[c][1]+'</small></span>'+e.cores[c]+'</li>').join('')+'</ul>';
  s += '<div class="grp">怎麼說</div><ul class="cores">'+TALK.filter(c=>e.cores[c]).map(c=>'<li><span class="nm">'+CORES[c][0]+'<small>'+CORES[c][1]+'</small></span>'+e.cores[c]+'</li>').join('')+'</ul>';
  s += '</div></div></details></section>';
  return s;
}

function renderDev(k, open){
  let s = '<details class="dev"'+(open?' open':'')+'><summary>'+k.age+'的'+k.pron+'，現在大概是這樣</summary><div class="devg">';
  for(const g in k.dev){ s += '<div><h4>'+g+'</h4><ul>'+k.dev[g].map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'; }
  return s+'</div></details>';
}

function render(){
  document.querySelectorAll('.kid').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.kid===state.kid)));
  if(!state.kid){ app.innerHTML=''; return; }
  const k = KIDS[state.kid];
  const mine = EVENTS.filter(e=>e.kid===state.kid);
  const ev = state.ev ? mine.find(e=>e.id===state.ev) : null;

  let s = '<section class="step s2"><span class="lab">2</span><h2>'+k.name+'現在什麼狀況？</h2>';
  s += renderDev(k, !ev);   // 瀏覽狀況時展開；選定狀況後收成一行，點一下可再展開
  if(ev){
    s += '<div class="picked">'+evTile(ev,true)+'<button type="button" class="swap" data-swap>換一個狀況</button></div>';
  } else {
    s += renderList(mine);
    s += '<div class="tools"><button type="button" data-all="'+(state.all?0:1)+'">'+(state.all?'收起全部':'全部展開（列印用）')+'</button></div>';
  }
  s += '</section>';

  if(ev) s += renderScript(ev,false);
  else if(state.all) s += '<div class="allview">'+mine.map(e=>renderScript(e,true)).join('')+'</div>';

  app.innerHTML = s;
  app.querySelectorAll('[data-ev]').forEach(b=>b.addEventListener('click', ()=>setHash('#'+state.kid+'/'+b.dataset.ev)));
  app.querySelectorAll('[data-swap]').forEach(b=>b.addEventListener('click', ()=>setHash('#'+state.kid)));
  app.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click', ()=>setHash('#'+state.kid+(b.dataset.all==='1'?'/all':''))));
  if(ev){ const t=document.querySelector('.s3'); if(t) t.scrollIntoView({block:'start'}); }
  else if(!state.all){ const t=document.querySelector('.s2'); if(t) t.scrollIntoView({block:'start'}); }
}

document.querySelectorAll('.kid').forEach(b=>b.addEventListener('click', ()=>setHash('#'+b.dataset.kid)));
window.addEventListener('hashchange', ()=>{ readHash(); render(); });
readHash(); render();
</script>
</body>
</html>
